[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "furniture-marketing-agent"
version = "0.1.0"
description = "Internal MVP platform for AI-assisted furniture marketing video production."
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1.0",
  "pydantic>=2.9,<3.0",
  "uvicorn[standard]>=0.30,<1.0",
]

[project.scripts]
fma-abo = "fma.data_sources.abo:main"
fma-catalog = "fma.app:run"
fma-creative = "fma.marketing:main"

[project.optional-dependencies]
dev = [
  "pytest>=8.0,<9.0",
  "httpx>=0.27,<1.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
fma = ["static/*.html"]
